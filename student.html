<div class="mt-auto pt-4 border-t border-slate-200">
        <div class="bg-red-50 rounded-[2.5rem] p-6 border border-red-100 flex items-center justify-between shadow-sm">
            <div>
                <p class="text-[9px] font-black uppercase text-red-600 mb-1 tracking-widest">Sicurezza</p>
                <h3 class="font-black text-sm italic tracking-tighter uppercase leading-tight text-slate-900">Hai bisogno di aiuto?</h3>
                <p class="text-[8px] font-bold text-red-400 uppercase mt-1">Invia posizione ai docenti</p>
            </div>
            <button onclick="sendSOS()" class="bg-red-600 text-white px-8 py-4 rounded-2xl font-black uppercase text-[10px] shadow-lg shadow-red-200 active:scale-95 transition-all">
                SOS
            </button>
        </div>
        <p class="text-center text-[8px] font-black text-gray-400 uppercase mt-4 tracking-widest">Gire Safe & Smart System — v.2.0</p>
    </div>

    <div id="qrModal" onclick="closeModal('qrModal')">
        <div class="bg-white p-8 rounded-[3rem] text-center max-w-xs w-full shadow-2xl" onclick="event.stopPropagation()">
            <h3 id="qrTitle" class="text-slate-900 font-black italic text-xl mb-6 uppercase">TICKET</h3>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=DEMO" class="w-full mb-8 rounded-2xl">
            <button onclick="closeModal('qrModal')" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase text-xs">CHIUDI</button>
        </div>
    </div>

    <div id="infoModal" onclick="closeModal('infoModal')">
        <div class="bg-white p-8 rounded-[3rem] max-w-sm w-full shadow-2xl" onclick="event.stopPropagation()">
            <h3 id="infoTitle" class="font-black italic text-2xl mb-4 text-indigo-600 uppercase"></h3>
            <p id="infoContent" class="text-sm font-medium leading-relaxed mb-8 text-gray-600"></p>
            <button onclick="closeModal('infoModal')" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-xs">HO CAPITO!</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ... (Mantenere tutto lo script della mappa e icone invariato fino a sendSOS) ...

        function sendSOS() { 
            const btn = event.target;
            btn.innerText = "INVIATO...";
            btn.classList.replace('bg-red-600', 'bg-slate-900');
            setTimeout(() => {
                alert("Richiesta SOS inviata con successo. La tua posizione GPS è ora visibile ai docenti.");
                btn.innerText = "SOS";
                btn.classList.replace('bg-slate-900', 'bg-red-600');
            }, 1000);
        }

        // Timer notifiche (Invariati)
        setTimeout(() => { document.getElementById('push-alert').classList.add('show'); }, 4000);
        setTimeout(() => { document.getElementById('push-alert').classList.remove('show'); }, 10000);
    </script>
