<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIRE - Area Studente</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0F172A; 
            color: white;
            overscroll-behavior: none;
        }
        
        /* Stile Mappa Dark */
        #map-student { 
            height: 180px; 
            border-radius: 1.5rem; 
            margin-top: 1rem;
            z-index: 10;
        }
        .leaflet-tile { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

        .sos-button {
            background: radial-gradient(circle, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
            transition: all 0.2s ease;
        }
        
        .sos-button:active { transform: scale(0.9); }

        .safe-card { 
            background: rgba(30, 41, 59, 0.5); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ticket-dashed { border-left: 2px dashed rgba(255,255,255,0.2); }
    </style>
</head>
<body class="flex flex-col min-h-screen p-5 pb-10">

    <header class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <div class="relative">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            </div>
            <div>
                <p class="text-[10px] font-black uppercase tracking-widest text-gray-500">GIRE • LIVE</p>
                <p class="text-[10px] text-purple-400 font-bold uppercase">Roma, 5ª B</p>
            </div>
        </div>
        <div class="text-right">
            <p class="text-sm font-black italic tracking-tighter">Marco Rossi</p>
        </div>
    </header>

    <div class="safe-card rounded-[2.5rem] p-5 mb-5">
        <div class="flex justify-between items-start mb-2">
            <div>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 italic">Prossima Tappa</p>
                <h2 class="text-xl font-black italic tracking-tighter leading-tight">Trattoria "Da Giggi"</h2>
            </div>
            <div class="bg-amber-400/20 px-3 py-1 rounded-full text-amber-400">
                <span class="font-black text-sm tracking-tighter">13:00</span>
            </div>
        </div>

        <div id="map-student"></div>
        
        <button class="w-full mt-4 bg-white text-slate-900 py-4 rounded-2xl font-black uppercase text-[10px] flex items-center justify-center gap-2 shadow-lg active:scale-95">
            <i class="fa-solid fa-location-arrow"></i> Ottieni indicazioni
        </button>
    </div>

    <div class="bg-indigo-600 rounded-[2.5rem] p-6 mb-5 shadow-xl border border-indigo-400/30">
        <div class="flex items-center justify-between gap-4">
            <h3 class="font-black text-lg italic tracking-tighter">Sei con il gruppo?</h3>
            <button onclick="confirmPresence(this)" class="bg-white text-indigo-600 px-6 py-3 rounded-xl font-black uppercase text-[10px] shadow-lg active:scale-95">
                Sì, Confermo
            </button>
        </div>
    </div>

    <div class="safe-card rounded-[2.5rem] p-5 mb-8">
        <p class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-4 italic">I tuoi Biglietti</p>
        <div class="flex bg-white/5 rounded-2xl overflow-hidden border border-white/5">
            <div class="p-4 flex-grow">
                <p class="text-[10px] font-black text-amber-500 uppercase">Oggi - 15:30</p>
                <p class="text-sm font-black italic tracking-tighter leading-none">Colosseo + Fori</p>
            </div>
            <button class="ticket-dashed px-4 bg-white/10 flex items-center justify-center text-[10px] font-black uppercase">
                QR
            </button>
        </div>
    </div>

    <div class="mt-auto flex flex-col items-center">
        <div class="relative flex justify-center mb-4">
            <button onclick="sendSOS()" class="sos-button w-28 h-28 rounded-full flex flex-col items-center justify-center border-4 border-white/10 z-10">
                <span class="font-black text-2xl italic tracking-tighter uppercase leading-none">SOS</span>
            </button>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-red-600/20 rounded-full animate-ping"></div>
        </div>
        <p class="text-center text-[9px] font-bold text-gray-500 uppercase tracking-widest px-10">
            Segnalazione di emergenza immediata
        </p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inizializza Mappa Studente
        // Centro sulla posizione fittizia di Marco (vicino al Pantheon)
        var mapStudent = L.map('map-student', { zoomControl: false }).setView([41.9005, 12.4715], 17);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapStudent);

        // Icona personalizzata per Marco (Studente)
        var iconStudent = L.divIcon({
            className: 'custom-div-icon',
            html: "<div style='background-color:#7C4DFF; width:12px; height:12px; border:2px solid white; border-radius:50%; box-shadow:0 0 10px #7C4DFF;'></div>",
            iconSize: [12, 12],
            iconAnchor: [6, 6]
        });

        // Icona per il punto di ritrovo
        var iconTarget = L.divIcon({
            className: 'custom-div-icon',
            html: "<div style='color:#F59E0B; font-size:20px;'><i class='fa-solid fa-location-dot'></i></div>",
            iconSize: [20, 20],
            iconAnchor: [10, 20]
        });

        L.marker([41.9005, 12.4715], {icon: iconStudent}).addTo(mapStudent).bindPopup('Tu');
        L.marker([41.8992, 12.4731], {icon: iconTarget}).addTo(mapStudent).bindPopup('Ristorante');

        // Funzione SOS (Ponte con Admin)
        function sendSOS() {
            if(confirm("Inviare SOS ai docenti?")) {
                localStorage.setItem('gire_sos_status', 'active');
                localStorage.setItem('gire_sos_student', 'Marco Rossi');
                alert("Allerta inviata. Rimani dove sei.");
            }
        }

        function confirmPresence(btn) {
            btn.innerText = "PRESENTE";
            btn.classList.replace('bg-white', 'bg-green-500');
            btn.classList.replace('text-indigo-600', 'text-white');
            btn.disabled = true;
        }
    </script>
</body>
</html>
