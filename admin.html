<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIRE - Booking Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; }
        .sidebar { background-color: #1A1C2E; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">

    <div class="md:hidden bg-[#1A1C2E] text-white p-4 flex justify-between items-center shadow-lg fixed top-0 left-0 right-0 z-[100]">
        <div class="flex items-center space-x-2">
            <img src="assets/logo.png" alt="Logo" class="h-6">
            <span class="font-black tracking-tighter italic">GIRE</span>
        </div>
        <button onclick="toggleMenu()" class="text-2xl p-2 bg-white/10 rounded-lg"><i class="fa-solid fa-bars"></i></button>
    </div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-[110] w-64 sidebar text-white transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 flex flex-col p-6">
        <div class="hidden md:flex items-center space-x-3 mb-10">
            <img src="assets/logo.png" alt="Logo" class="h-8">
            <span class="text-xl font-black tracking-tighter italic">GIRE</span>
        </div>
        <nav class="flex-grow space-y-2">
            <a href="mappa.html" class="flex items-center p-3 hover:bg-white/10 rounded-xl transition"><i class="fa-solid fa-map-location-dot mr-3 w-5"></i> Live Map</a>
            <a href="admin.html" class="flex items-center p-3 bg-purple-600 rounded-xl font-bold"><i class="fa-solid fa-hotel mr-3 w-5"></i> Booking Hub</a>
            <a href="appello.html" class="flex items-center p-3 hover:bg-white/10 rounded-xl transition"><i class="fa-solid fa-users mr-3 w-5"></i> Appello Classe</a>
            <a href="inclusione.html" class="flex items-center p-3 hover:bg-white/10 rounded-xl transition text-blue-300"><i class="fa-solid fa-hand-holding-heart mr-3 w-5"></i> Area Inclusione</a>
        </nav>
        <div class="mt-auto pt-6 border-t border-white/10">
            <a href="demo.html" class="block p-3 bg-white/5 rounded-xl text-white font-black uppercase tracking-widest text-[10px] hover:bg-white/10 transition text-center">
                <i class="fa-solid fa-house mr-2"></i> Torna alla Dashboard
            </a>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto pt-[88px] md:pt-8 px-4 md:px-8">
        <h1 class="text-3xl font-black text-gray-900 uppercase italic tracking-tighter mb-8">Amministrazione</h1>
        
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100 max-w-2xl mb-6">
            <div class="flex justify-between items-start mb-6">
                <h3 class="font-black text-[11px] uppercase text-gray-400 italic">Documentazione e MEPA</h3>
                <span class="bg-green-100 text-green-600 px-3 py-1 rounded-full text-[9px] font-black italic">CONNESSO</span>
            </div>
            
            <div class="p-4 bg-green-50 rounded-2xl border border-green-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-shield-check text-green-500"></i>
                    <span class="text-green-800 font-black text-[10px] uppercase italic">Piattaforma MEPA Attiva</span>
                </div>
                <button class="text-[9px] font-black text-white bg-green-500 px-3 py-1 rounded-lg uppercase">Sincronizza</button>
            </div>
        </div>
    </main>

    <script>function toggleMenu() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }</script>
</body>
</html>
