<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIRE - Live Map Full</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        #map-full { height: 100vh; width: 100%; z-index: 1; }
        .sidebar { background-color: #1A1C2E; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">

    <div class="md:hidden bg-[#1A1C2E] text-white p-4 flex justify-between items-center shadow-lg z-[60]">
        <div class="flex items-center space-x-2">
            <img src="assets/logo.png" alt="Logo" class="h-6">
            <span class="font-black tracking-tighter">GIRE</span>
        </div>
        <button onclick="toggleMenu()" class="text-2xl p-2"><i class="fa-solid fa-bars"></i></button>
    </div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 sidebar text-white transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 flex flex-col p-6">
        <div class="hidden md:flex items-center space-x-3 mb-10">
            <img src="assets/logo.png" alt="Logo" class="h-8">
            <span class="text-xl font-black tracking-tighter">GIRE</span>
        </div>
        <nav class="flex-grow space-y-2">
            <a href="mappa.html" class="flex items-center p-3 bg-purple-600 rounded-xl font-bold">
                <i class="fa-solid fa-map-location-dot mr-3 w-5"></i> Live Map
            </a>
            <a href="admin.html" class="flex items-center p-3 hover:bg-white/10 rounded-xl transition">
                <i class="fa-solid fa-hotel mr-3 w-5"></i> Booking Hub
            </a>
            <a href="appello.html" class="flex items-center p-3 hover:bg-white/10 rounded-xl transition">
                <i class="fa-solid fa-users mr-3 w-5"></i> Appello Classe
            </a>
            <a href="inclusione.html" class="flex items-center p-3 hover:bg-white/10 rounded-xl transition text-blue-300">
                <i class="fa-solid fa-hand-holding-heart mr-3 w-5"></i> Area Inclusione
            </a>
        </nav>
        <div class="mt-auto pt-6 border-t border-white/10 text-[10px] text-gray-400">
            <p class="font-bold uppercase tracking-widest text-purple-400 mb-2">Navigazione</p>
            <a href="demo.html" class="block p-3 bg-white/5 rounded-xl text-white font-black uppercase tracking-widest hover:bg-white/10 transition">
                <i class="fa-solid fa-house mr-2"></i> Torna alla Dashboard
            </a>
        </div>
    </aside>

    <main class="flex-1 relative">
        <div id="map-full"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        var map = L.map('map-full', { zoomControl: false }).setView([41.8992, 12.4731], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.marker([41.8992, 12.4731]).addTo(map).bindPopup('<b>Gruppo 5ª B</b><br>Posizione Attuale');
    </script>
</body>
</html>
