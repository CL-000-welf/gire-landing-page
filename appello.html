<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIRE - Appello Classe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter">Appello Digitale</h1>
            <a href="demo.html" class="text-gray-400 hover:text-black transition text-2xl"><i class="fa-solid fa-circle-xmark"></i></a>
        </div>

        <div class="bg-blue-600 rounded-3xl p-6 text-white mb-8 shadow-xl shadow-blue-200">
            <h3 class="text-[10px] font-black uppercase tracking-widest mb-4 opacity-80">Supporto Speciale (L. 104)</h3>
            <div class="bg-white/10 p-4 rounded-2xl flex items-center justify-between border border-white/20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white text-blue-600 rounded-full flex items-center justify-center font-black">MR</div>
                    <div>
                        <p class="font-black">Marco Rossi</p>
                        <p class="text-[10px] font-bold opacity-70">Sostegno: Prof.ssa Bianchi</p>
                    </div>
                </div>
                <i class="fa-solid fa-check-double text-green-300"></i>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
            <h3 class="text-[10px] font-black uppercase text-gray-400 mb-6">Studenti Presenti (23/24)</h3>
            <div class="space-y-4">
                <div class="flex items-center justify-between border-b pb-3">
                    <span class="font-bold text-gray-700">Andrea B.</span>
                    <i class="fa-solid fa-circle-check text-green-500"></i>
                </div>
                <div class="flex items-center justify-between border-b pb-3">
                    <span class="font-bold text-gray-700">Lucia M.</span>
                    <i class="fa-solid fa-circle-check text-green-500"></i>
                </div>
            </div>
        </div>
    </div>

</html>
