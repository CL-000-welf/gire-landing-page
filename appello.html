<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIRE - Appello Classe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; }
        .sidebar { background-color: #1A1C2E; }
        /* Stile card quando selezionata */
        .student-card.present { border-color: #10B981; background-color: #ECFDF5; transform: scale(0.96); }
        .student-card.present i { color: #10B981; }
        .student-card.present .avatar { background-color: #10B981; color: white; }
        
        /* Stile speciale per supporto */
        .support-card.present { border-color: #7C4DFF; background-color: #F5F3FF; transform: scale(0.98); }
        .support-card.present i.check-icon { color: #7C4DFF; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">

    <div class="md:hidden bg-[#1A1C2E] text-white p-4 flex justify-between items-center shadow-lg fixed top-0 left-0 right-0 z-[100]">
        <div class="flex items-center space-x-2">
            <img src="assets/logo.png" alt="Logo" class="h-6">
            <span class="font-black tracking-tighter italic">GIRE</span>
        </div>
        <button onclick="toggleMenu()" class="text-2xl p-2 bg-white/10 rounded-lg"><i class="fa-solid fa-bars"></i></button>
    </div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-[110] w-64 sidebar text-white transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 flex flex-col p-6">
        <div class="hidden md:flex items-center space-x-3 mb-10">
            <img src="assets/logo.png" alt="Logo" class="h-8">
            <span class="text-xl font-black tracking-tighter italic">GIRE</span>
        </div>
        <nav class="flex-grow space-y-2">
            <a href="mappa.html" class="flex items-center p-3 hover:bg-white/10 rounded-xl transition"><i class="fa-solid fa-map-location-dot mr-3 w-5"></i> Live Map</a>
            <a href="admin.html" class="flex items-center p-3 hover:bg-white/10 rounded-xl transition"><i class="fa-solid fa-hotel mr-3 w-5"></i> Booking Hub</a>
            <a href="appello.html" class="flex items-center p-3 bg-purple-600 rounded-xl font-bold"><i class="fa-solid fa-users mr-3 w-5"></i> Appello Classe</a>
            <a href="inclusione.html" class="flex items-center p-3 hover:bg-white/10 rounded-xl transition text-blue-300"><i class="fa-solid fa-hand-holding-heart mr-3 w-5"></i> Area Inclusione</a>
        </nav>
        <div class="mt-auto pt-6 border-t border-white/10">
            <a href="demo.html" class="block p-3 bg-white/5 rounded-xl text-white font-black uppercase tracking-widest text-[10px] hover:bg-white/10 transition text-center">
                <i class="fa-solid fa-house mr-2"></i> Torna alla Dashboard
            </a>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto pt-[88px] md:pt-8 px-4 md:px-8">
        <div class="max-w-5xl mx-auto pb-20">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 gap-4">
                <div>
                    <h1 class="text-3xl font-black text-gray-900 uppercase italic tracking-tighter leading-none">Appello Digitale</h1>
                    <p class="text-gray-400 font-bold text-xs uppercase italic mt-2">Gita a Roma • 5ª B</p>
                </div>
                <div class="flex items-center gap-6">
                    <button onclick="resetAppello()" class="text-[10px] font-black text-red-500 uppercase tracking-widest border-2 border-red-100 px-4 py-2 rounded-xl hover:bg-red-50 transition">
                        <i class="fa-solid fa-rotate-left mr-1"></i> Reset
                    </button>
                    <div class="text-right">
                        <span id="counter" class="text-4xl font-black text-purple-600">0</span>
                        <span class="text-gray-300 font-black text-xl">/12</span>
                    </div>
                </div>
            </div>

            <div class="mb-10">
                <h3 class="text-[10px] font-black text-purple-600 uppercase mb-4 tracking-widest italic flex items-center">
                    <i class="fa-solid fa-star mr-2"></i> Studenti con Supporto Speciale
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div onclick="toggleSupport(this)" class="support-card cursor-pointer bg-white p-5 rounded-[1.5rem] shadow-sm border-2 border-transparent flex justify-between items-center transition-all hover:border-purple-200">
                        <div class="flex items-center gap-4">
                            <div class="avatar w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center font-black">MR</div>
                            <div>
                                <p class="font-black text-gray-900 text-sm uppercase">Marco Rossi</p>
                                <p class="text-[9px] font-bold text-purple-400 uppercase tracking-tighter">Sostegno: Prof.ssa Bianchi</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-circle-check text-gray-100 text-3xl check-icon transition-colors"></i>
                    </div>
                    <div onclick="toggleSupport(this)" class="support-card cursor-pointer bg-white p-5 rounded-[1.5rem] shadow-sm border-2 border-transparent flex justify-between items-center transition-all hover:border-purple-200">
                        <div class="flex items-center gap-4">
                            <div class="avatar w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center font-black">SG</div>
                            <div>
                                <p class="font-black text-gray-900 text-sm uppercase">Sara Gialli</p>
                                <p class="text-[9px] font-bold text-purple-400 uppercase tracking-tighter">Sostegno: Prof. Neri</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-circle-check text-gray-100 text-3xl check-icon transition-colors"></i>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="text-[10px] font-black text-gray-400 uppercase mb-4 tracking-widest italic flex items-center">
                    <i class="fa-solid fa-list mr-2"></i> Elenco Alunni
                </h3>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3" id="studentGrid"></div>
            </div>

        </div>
    </main>

    <script>
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        
        const students = ["Andrea B.", "Lucia M.", "Sofia F.", "Giulia T.", "Valerio P.", "Elena S.", "Matteo L.", "Chiara G.", "Davide M.", "Simone R."];
        const grid = document.getElementById('studentGrid');
        
        // Generazione Card Standard
        students.forEach(s => {
            const card = document.createElement('div');
            card.className = "student-card bg-white border-2 border-transparent p-4 rounded-2xl cursor-pointer transition-all hover:border-gray-200 text-center flex flex-col items-center gap-2 shadow-sm";
            card.innerHTML = `
                <div class='avatar w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-black text-gray-400 text-[10px] transition-all'>${s[0]}</div>
                <span class='font-black text-[10px] uppercase truncate w-full'>${s}</span>
                <i class="fa-solid fa-circle-check text-gray-100 transition-colors"></i>
            `;
            card.onclick = () => {
                card.classList.toggle('present');
                updateTotal();
            };
            grid.appendChild(card);
        });

        // Funzione per i due studenti speciali
        function toggleSupport(el) {
            el.classList.toggle('present');
            updateTotal();
        }

        // Calcolo totale dinamico
        function updateTotal() {
            const total = document.querySelectorAll('.present').length;
            document.getElementById('counter').innerText = total;
        }

        // Funzione Reset
        function resetAppello() {
            document.querySelectorAll('.present').forEach(el => {
                el.classList.remove('present');
            });
            updateTotal();
        }
    </script>
</body>
</html>
